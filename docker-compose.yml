services:
  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    environment:
      DEPLOY: cloud
      CLI_PROXY_PORT: ${CLI_PROXY_PORT:-8318}
      PGSTORE_DSN: ${PGSTORE_DSN:?Set PGSTORE_DSN in Dokploy}
      PGSTORE_SCHEMA: ${PGSTORE_SCHEMA:-public}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
      CLI_PROXY_CONFIG_B64: ${CLI_PROXY_CONFIG_B64:-}
      CLI_PROXY_API_KEYS_JSON: ${CLI_PROXY_API_KEYS_JSON:-}
      CLI_PROXY_CONFIG_YAML: ${CLI_PROXY_CONFIG_YAML:-}
    ports:
      - "8318:8318"
    volumes:
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - "../files/logs:/CLIProxyAPI/logs"
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
